apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-website
  labels:
    app: nimbus-website
spec:
  replicas:                                                                    #run 2 pods
  selector:
    matchLabels:
      app: nimbus-website
  strategy:
     type: RollingUpdate                                                          #default,  safe rollouts
  template:
    metadata:
      labels:
        app: nimbus-website
    spec:
      containers:
      - name: web
        image: nimbusacr101.azurecr.io/nimbus-site:v1                            # your acr image
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 80
        resources:                                                               # tiny but realistic
          requests:
            cpu: 100m
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5    
        livenessProbe:
          httpGet:  
           path: /
           port: 80     
          initialDelaySeconds: 15
          periodSeconds: 10
           