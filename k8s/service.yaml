apiVersion: v1
kind: Service
metadata:
  name: nimbus-website
  labels:
    app: nimbus-website
spec:
  type: LoadBalancer                      #aks will create a public ip and dns name for you
  selector:
    app: nimbus-website
  ports:
    - name: http
      port: 80                             #service port
      targetPort: 80                       #container port
